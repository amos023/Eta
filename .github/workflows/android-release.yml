name: Eta Build

on:
  # 只在发版标签与手动触发时构建：日常提交由本地构建验证，
  # 推 main 触发一次 Debug+Release 打包却不上传产物，纯属浪费 runner 时间。
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 与打包并行且不接触签名 Secrets；失败不影响 APK 上传。
  #
  # 只在推标签（发版）时跑：全套 lint + 2003 个用例在共享 runner 上要十几分钟，
  # 每次推 main 都跑一遍对日常提交没有收益——编码阶段的反馈由本地构建提供，
  # 发版前的把关由标签构建提供。
  verify:
    name: Lint 与单元测试
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: Lint 与单元测试
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          :app:lintDebug :app:testDebugUnitTest

      - name: 上传检查报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-apks:
    name: 构建 Debug 与 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 还原发布证书
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$ETA_RELEASE_KEYSTORE_BASE64" ||
                -z "$ETA_RELEASE_STORE_PASSWORD" ||
                -z "$ETA_RELEASE_KEY_ALIAS" ||
                -z "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::缺少 Release 签名 Secrets，请检查仓库的 Actions Secrets。"
            exit 1
          fi
          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/eta-release.jks"

      # 在耗时十几分钟的编译之前先把签名配置验一遍：
      # 别名拼错、密码不对、密钥库损坏都会在 packageRelease 阶段才暴露，
      # 那时已经白等十几分钟，日志里别名还被 Secret 打码成 *** 无法分辨。
      - name: 校验签名配置
        env:
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
        run: |
          KEYSTORE="$RUNNER_TEMP/eta-release.jks"
          echo "密钥库大小: $(stat -c%s "$KEYSTORE") 字节"

          ALIAS="$ETA_RELEASE_KEY_ALIAS"
          echo "别名长度: ${#ALIAS}"
          # 前后空白与不可见字符是复制粘贴最常见的问题，别名本身不会包含它们。
          if [[ "$ALIAS" != "${ALIAS#"${ALIAS%%[![:space:]]*}"}" ||
                "$ALIAS" != "${ALIAS%"${ALIAS##*[![:space:]]}"}" ]]; then
            echo "::error::ETA_RELEASE_KEY_ALIAS 前后含有空白字符，请重新填写。"
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE" -storepass "$ETA_RELEASE_STORE_PASSWORD" \
                >/dev/null 2>&1; then
            echo "::error::密钥库打不开，检查 ETA_RELEASE_STORE_PASSWORD 是否正确。"
            exit 1
          fi

          ENTRIES=$(keytool -list -keystore "$KEYSTORE" -storepass "$ETA_RELEASE_STORE_PASSWORD" 2>/dev/null \
            | grep -c "PrivateKeyEntry" || true)
          echo "密钥库内有 $ENTRIES 个私钥条目"

          if ! keytool -list -keystore "$KEYSTORE" -storepass "$ETA_RELEASE_STORE_PASSWORD" \
                -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::ETA_RELEASE_KEY_ALIAS 在密钥库中不存在（长度 ${#ALIAS}，期望 10）。"
            exit 1
          fi

          echo "签名配置校验通过"

      - name: 构建 Debug 与 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        # 发版标签保持纯净版本名；其余构建追加 +<短提交号>，与已发布版本区分
        run: |
          metadata_arg=()
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            metadata_arg=("-Peta.buildMetadata=${GITHUB_SHA::7}")
          fi
          # 正式版走独立 applicationId 后缀，产物与设备上的 .stable 包同名可覆盖
          ./gradlew --no-daemon --no-configuration-cache "${metadata_arg[@]}" \
            -Peta.appIdSuffix=.stable \
            :app:assembleDebug :app:assembleRelease

      - name: 验证并整理 APK
        id: apk
        run: |
          # 文件名由 Gradle 按 versionName 生成，例如 Eta-vX.Y.Z.apk、Eta-vX.Y.Z-debug+<sha>.apk
          shopt -s nullglob
          debug_apks=(app/build/outputs/apk/debug/Eta-v*.apk)
          release_apks=(app/build/outputs/apk/release/Eta-v*.apk)
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [[ ${#debug_apks[@]} -ne 1 ]]; then
            echo "::error::Debug APK 数量异常（${#debug_apks[@]}）。"
            exit 1
          fi
          if [[ ${#release_apks[@]} -ne 1 ]]; then
            echo "::error::Release APK 数量异常（${#release_apks[@]}）。"
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          "$apksigner_path" verify "${release_apks[0]}"

          # 发版标签必须与 versionName 一致，避免标签与安装包版本错位
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version_name="$(jq -r '.elements[0].versionName' \
              app/build/outputs/apk/release/output-metadata.json)"
            if [[ "$GITHUB_REF_NAME" != "v$version_name" ]]; then
              echo "::error::标签 $GITHUB_REF_NAME 与 versionName $version_name 不一致。"
              exit 1
            fi
          fi
          echo "debug_path=${debug_apks[0]}" >> "$GITHUB_OUTPUT"
          echo "release_path=${release_apks[0]}" >> "$GITHUB_OUTPUT"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.debug_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  # Release APK 仅上传到 Actions Artifacts；GitHub Release 由维护者手动发布。
